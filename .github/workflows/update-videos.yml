name: Update Videos from YouTube

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-videos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: scripts/go.mod
          cache-dependency-path: scripts/go.mod

      - name: Test video fetcher
        working-directory: scripts
        run: go test ./...

      - name: Fetch videos from YouTube
        working-directory: scripts
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: go run .

      - name: Check if videos changed
        id: check_changes
        run: |
          if git diff --quiet data/videos.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          commit-message: 'feat: update videos from YouTube channel'
          title: 'feat: update videos from YouTube channel'
          body: |
            ## 📹 Videos Updated

            This PR updates the videos from the Go Meetup Prague YouTube channel.

            ### Changes
            - Fetched latest videos from YouTube API
            - Updated `data/videos.json` with new videos

            Please review and merge if everything looks good.
          branch: feature/update-videos-${{ github.run_number }}
          delete-branch: true

      - name: No changes found
        if: steps.check_changes.outputs.changed == 'false'
        run: echo "✅ No new videos found. Videos are up to date!"
