<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "en" }}">
  {{- partial "head.html" . -}}
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    {{- partial "header.html" . -}}
    <main id="main-content" tabindex="-1">
      {{- block "main" . }}{{- end }}
    </main>
    {{- partial "footer.html" . -}}
  </body>
</html>
